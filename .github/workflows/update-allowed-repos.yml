

name: Update DockerHub Allowed Repos

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 1 * *'  # Run at 00:00 on the 1st of every month
  push:
    paths:
      - 'dockerhub_filter_config.yaml'
      - 'dockerhub_filter.py'

permissions:
  contents: write

jobs:
  update-allowed-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DockerHub filter script
        run: |
          python dockerhub_filter.py dockerhub_filter_config.yaml

      - name: Commit and push changes
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add allowed_repos.yaml all_repos.yaml allowed_repos_by_software.yaml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Update allowed and all DockerHub repo lists [auto]'
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only allowed_repos*.yaml changes should move the documentation, which
      # embeds these lists; all_repos.yaml is informational and doesn't.
      - name: Trigger documentation rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if git diff --name-only HEAD~1 HEAD -- allowed_repos.yaml allowed_repos_by_software.yaml | grep -q .; then
            gh workflow run deploy.yml --repo SIVACOR/documentation --ref main
          fi

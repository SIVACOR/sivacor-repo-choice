# Configuration for Docker Hub repository filtering
# List repositories and filtering rules (regex supported)
# A namespace can be repeated to apply different filters
# Version: 2026-03-09

software:
  - name: Stata (older)
    description: Older versions of Stata software
    sort_order: 10
  - name: Stata
    description: Current versions of Stata software
    sort_order: 1
  - name: Stata w Python
    description: Recent versions of Stata software with Python
    sort_order: 3
  - name: R
    description: R programming language images
    sort_order: 2
  - name: MATLAB
    description: MATLAB software images
    sort_order: 4
  - name: Dynare
    description: Dynare software images
    sort_order: 5
  - name: Julia
    description: Julia programming language images
    sort_order: 6

repositories:
  - namespace: dataeditors
    software:
      - Stata (older)
    filters:
      - repo_regex: '^stata1[5-7]$'
      - tag_regex: '^\d{4}-\d{2}-\d{2}$'
        keep_latest_n: 1
  - namespace: dataeditors
    software:
      - Stata
    filters:
      - repo_regex: '^stata1[8-9].*-mp$'
      - tag_regex: '^\d{4}-\d{2}-\d{2}$'
        blacklist:
        # This build had issues
          - '2025-08-14'
        keep_latest_n: 4
  - namespace: dataeditors
    software:
      - Stata w Python
    filters:
      - repo_regex: '^stata1[8-9].*mp-i-python$'
      - tag_regex: '^\d{4}-\d{2}-\d{2}$'
        keep_latest_n: 4
  - namespace: rocker
    software:
      - R
    filters:
      - repo_regex: '^r-ver$|^tidyverse$|^verse$|^geospatial$'
      - tag_regex: '^(4\.[2-9]\.\d+|[5-9]\.\d+\.\d+|[1-9][0-9]\.\d+\.\d+)$'
        blacklist:
          - 'devel'
  - namespace: dynare
    software:
      - MATLAB
      - Dynare
    filters:
      - repo_regex: '^dynare$'
      - tag_regex: '^[4-6]\.\d+-R\d{4}[a-b]$'
  - namespace: sivacor
    # GitHub Container Registry, not Docker Hub. SIVACOR builds these itself
    # (https://github.com/SIVACOR/julia) because the official Julia image ships
    # no package registry and no non-root user.
    registry: ghcr.io
    # The OCI API cannot list a namespace's repositories, so they are named
    # here. One per Julia release line: a single repository holding every line
    # would put keep_latest_n's ungrouped truncation to work against us, keeping
    # only the newest-versioned tags and silently dropping 1.10 and 1.11.
    repositories:
      - julia1.10
      - julia1.11
      - julia1.13
    software:
      - Julia
    filters:
      # <julia version>-<build date UTC>, with a suffix if a line is rebuilt
      # twice in one day. A tag is never overwritten, so a TRO citing one keeps
      # resolving; ageing out of keep_latest_n stops a tag being *offered*, not
      # from existing.
      - tag_regex: '^\d+\.\d+\.\d+-\d{8}(\.\d+)?$'
        keep_latest_n: 4
